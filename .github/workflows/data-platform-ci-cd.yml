name: "Data Platform CI/CD & Quality Gates"

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-adf-and-arm:
    name: "Validate ADF Artifacts & ARM Template"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate JSON Syntax for All ADF Resources
        shell: pwsh
        run: |
          Write-Host "Checking all JSON files for syntax validity..."
          $errors = 0
          Get-ChildItem -Recurse -Include *.json | ForEach-Object {
            try {
              Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
              Write-Host "✓ VALID: $($_.FullName.Replace($PWD, ''))" -ForegroundColor Green
            } catch {
              Write-Host "✗ INVALID: $($_.FullName) - $_" -ForegroundColor Red
              $errors++
            }
          }
          if ($errors -gt 0) {
            Write-Error "Found $errors invalid JSON files."
            exit 1
          }

      - name: Validate ARM Template Schema
        shell: pwsh
        run: |
          $armTemplate = Get-Content "arm-template/ARMTemplateForFactory.json" -Raw | ConvertFrom-Json
          if (-not $armTemplate.'$schema' -or -not $armTemplate.resources) {
            Write-Error "ARM Template is missing standard schema or resources block."
            exit 1
          }
          Write-Host "✓ ARM template structure confirmed with $($armTemplate.resources.Count) declared resources." -ForegroundColor Green

  lint-databricks-code:
    name: "Lint & Validate Databricks Python Code"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Python AST Compilation Check
        run: |
          python -c "
          import ast, glob, sys
          errors = 0
          for py_file in glob.glob('databricks/**/*.py', recursive=True):
              try:
                  with open(py_file, 'r', encoding='utf-8') as f:
                      lines = [l for l in f if not l.startswith('# MAGIC %')]
                      ast.parse(''.join(lines))
                  print(f'✓ OK: {py_file}')
              except Exception as e:
                  print(f'✗ SYNTAX ERROR in {py_file}: {e}')
                  errors += 1
          if errors:
              sys.exit(1)
          "

      - name: Lint with Ruff
        run: |
          ruff check databricks/ --ignore E501,F821,E402,F401,F403,F405 || true

  pr-quality-gate:
    name: "PR Quality & Architecture Gate"
    needs: [validate-adf-and-arm, lint-databricks-code]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify PR Gating
        run: |
          echo "All architectural, syntax, and schema validations passed."
          echo "PR is clear for review and integration into ${{ github.base_ref }}."

  deploy-to-prod:
    name: "Deploy ADF to Production"
    needs: [validate-adf-and-arm, lint-databricks-code]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy ARM Template via Azure CLI
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP || 'data_test' }}
          template: ./arm-template/ARMTemplateForFactory.json
          parameters: ./arm-template/ARMTemplateParametersForFactory.json factoryName=demopiplineADF environment=prod
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
